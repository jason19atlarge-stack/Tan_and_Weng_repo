# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id: "481743261495002113" # Set this to the ID of your Wokwi project (the number from the project's URL)
  title: "Tiny Tapeout Template TANJIN" # Project title
  author: "Tan Jin" # Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Three tiny numbers walk into a chip, 20261126 and HAPPY join the
    party, and a blinking dot steals the show!" # One line description of what your project does
  language: "Wokwi" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 1 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "B0"
  ui[3]: "B1"
  ui[4]: "C0"
  ui[5]: "C1"
  ui[6]: "MODE"
  ui[7]: "SELECT"

  # Outputs
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "SEG_DP"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
